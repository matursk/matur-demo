<!doctype html>
<html lang="sk">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#05060b" />
		<title>Matur — Space Landing</title>
		<meta name="description" content="Matur — Rýchlo. Efektívne. Pripravení." />
		<link rel="icon" type="image/png" href="/app_icon.png" />
	</head>
	<body class="bg-bg text-white antialiased">
		<!-- Inline SVG filter for navbar ripple (autonomous animation, no mouse interaction) -->
		<!-- Edit CSS variables in src/styles/globals.css to tune intensity and frequency -->
		<svg aria-hidden="true" focusable="false" style="position:fixed; width:0; height:0; pointer-events:none;">
			<defs>
				<filter id="nav-ripple">
					<!-- Subtle noise field; animated baseFrequency for gentle ripples -->
					<feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="4" result="noise">
						<animate attributeName="baseFrequency" dur="14s" values="0.006;0.009;0.006" repeatCount="indefinite"></animate>
					</feTurbulence>
					<!-- Displace backdrop using noise; scale is best-effort tied to CSS var -->
					<feDisplacementMap in="SourceGraphic" in2="noise" scale="0.04" xChannelSelector="R" yChannelSelector="G">
						<!-- Very slight autonomous ripple (~4%) -->
						<animate attributeName="scale" dur="12s" values="0.04;0.03;0.04" repeatCount="indefinite"></animate>
					</feDisplacementMap>
				</filter>
			</defs>
		</svg>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
	</html>
